id: ipgeolocation_io
name: IPGeolocation.io MCP Server
description: >-
  The official IPGeolocation.io MCP server provides tools for IP geolocation,
  company information, ASN and network data, IP security (VPN, proxy, Tor, bot,
  hosting and spam detection), abuse contacts, time zones, astronomy, currency
  data and user-agent parsing.
author: IPGeolocation.io
url: https://github.com/IPGeolocation/ipgeolocation-io-mcp
license: MIT
category: security
tags:
  - ip-geolocation
  - asn
  - network
  - ip-security
  - osint
installations:
  - name: Local (NPX)
    description: Run 17 tools locally with Node.js 22 or later. The local server also includes get_my_ip, which works without an API key.
    config: |-
      {
        "command": "npx",
        "args": ["-y", "ipgeolocation-io-mcp@latest"],
        "env": {
          "IPGEOLOCATION_API_KEY": "${IPGEOLOCATION_API_KEY}"
        }
      }
    prerequisites:
      - Node.js 22 or later with npx
    parameters:
      - name: IPGeolocation.io API key
        key: IPGEOLOCATION_API_KEY
        description: Most tools require a key. The server can start and get_my_ip works without one. Data access depends on your API plan.
        placeholder: "<YOUR_API_KEY>"
        required: false
    transports:
      - stdio
  - name: Hosted
    description: Connect to 16 tools over Streamable HTTP. No Node.js installation is required for the hosted server.
    config: |-
      {
        "url": "https://mcp.ipgeolocation.io/mcp",
        "headers": {
          "X-IPGeolocation-API-Key": "${IPGEOLOCATION_API_KEY}"
        }
      }
    parameters:
      - name: IPGeolocation.io API key
        key: IPGEOLOCATION_API_KEY
        description: Set this header in your private client settings.
        placeholder: "<YOUR_API_KEY>"
        required: true
    transports:
      - streamable-http
featured: false
verified: false
