id: dchub
name: DC Hub
description: >-
  DC Hub is the orchestration layer for data center and energy intelligence:
  start with execute_plan. It also publishes the Data Center Power Index (DCPI),
  a daily score of where data centers can get grid power, across 300+ markets.
  Live grid feeds from the seven US ISOs, interconnection queues, energy prices,
  fiber and gas infrastructure, with as-of timestamps and citations. 96 tools.
  DCHUB_API_KEY is optional.
author: azmartone67
url: https://github.com/azmartone67/dchub-mcp-server
category: data
tags:
  - data-center
  - energy
  - power-grid
  - site-selection
  - interconnection-queue
  - electricity-prices
  - remote
installations:
  - name: Remote
    description: Hosted Streamable HTTP endpoint. DCHUB_API_KEY is optional.
    config: |-
      {
        "type": "streamable-http",
        "url": "https://dchub.cloud/mcp"
      }
    prerequisites:
      - MCP client supporting Streamable HTTP
    transports:
      - streamable-http
featured: false
verified: false
